<style>
  :root{
    --paper:#f4f0e6;--surface:#fdfbf6;--surface2:#faf5ea;
    --ink:#2c2722;--ink2:#6f665a;--ink3:#a59b8b;
    --line:#e7ddc9;--line2:#ded2ba;
    --verm:#b0392c;--jade:#3f6b54;--amber:#bb8a2e;
    --verm-tint:color-mix(in srgb,var(--verm) 13%,var(--paper));
    --verm-bd:color-mix(in srgb,var(--verm) 34%,var(--paper));
    --jade-tint:color-mix(in srgb,var(--jade) 15%,var(--paper));
    --jade-bd:color-mix(in srgb,var(--jade) 40%,var(--paper));
    --amber-tint:color-mix(in srgb,var(--amber) 17%,var(--paper));
    --amber-bd:color-mix(in srgb,var(--amber) 42%,var(--paper));
  }
  *{box-sizing:border-box;}
  .serif{font-family:'Noto Serif TC',serif;}
  .sans{font-family:'Noto Sans TC',sans-serif;}
  .num{font-family:'Newsreader',serif;}
  .fl{font-family:'Noto Sans TC',sans-serif;font-weight:500;font-size:12px;letter-spacing:.14em;color:#a59b8b;text-transform:uppercase;margin:0 0 12px 6px;}
  .page{width:372px;min-height:760px;border-radius:38px;overflow:hidden;border:1px solid #e7ddc9;box-shadow:0 22px 55px -14px rgba(44,39,34,.22);background:var(--paper);display:flex;flex-direction:column;}
  .sb{display:flex;justify-content:space-between;align-items:center;padding:15px 28px 4px;font-family:'Newsreader',serif;font-weight:600;font-size:14px;color:var(--ink);flex:none;}
  .batt{width:17px;height:9px;border:1.4px solid var(--ink);border-radius:2px;position:relative;display:inline-block;}
  .batt::after{content:'';position:absolute;right:-3px;top:2.5px;width:2px;height:4px;background:var(--ink);border-radius:0 1px 1px 0;}
  .navbar{background:var(--surface);border-top:1px solid var(--line);padding:9px 22px 22px;display:flex;justify-content:space-between;margin-top:auto;flex:none;}
  .foot{margin-top:auto;padding:16px 24px 26px;flex:none;}
  .tab{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--ink3);}
  .tab span{font-family:'Noto Sans TC',sans-serif;font-size:10px;}
  .tab.on{color:var(--verm);}
  .tab.on span{font-weight:500;}
  .chev{color:var(--verm);font-size:18px;font-family:'Noto Serif TC',serif;}
  .primary{font-family:'Noto Serif TC',serif;text-align:center;background:var(--verm);color:#fff;padding:13px;border-radius:6px;font-size:16px;}
  .inkbtn{font-family:'Noto Serif TC',serif;text-align:center;background:var(--ink);color:var(--paper);padding:13px;border-radius:6px;font-size:16px;}
  .seal{font-family:'Noto Serif TC',serif;display:flex;align-items:center;justify-content:center;border:1.4px solid var(--verm);color:var(--verm);border-radius:5px;font-weight:700;flex:none;}
  .ptrack{height:4px;background:var(--line);border-radius:2px;overflow:hidden;}
  .pfill{height:100%;background:var(--jade);border-radius:2px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:11px;}
  .typebadge{display:inline-flex;align-items:center;font-family:'Noto Sans TC',sans-serif;font-size:10px;letter-spacing:.06em;border-radius:3px;padding:3px 8px;font-weight:500;}
  .lock{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--amber-bd);background:var(--amber-tint);border-radius:3px;padding:2px 7px;font-family:'Noto Sans TC',sans-serif;font-size:10px;color:#8a6420;font-weight:600;}
  .seclab{font-family:'Noto Sans TC',sans-serif;font-size:11px;letter-spacing:.2em;color:var(--ink3);border-bottom:1px solid var(--line);padding-bottom:8px;}
  .seg{display:flex;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:3px;}
  .seg-item{flex:1;text-align:center;padding:8px 2px;font-size:11px;font-family:'Noto Serif TC',serif;color:var(--ink2);}
  .seg-on{background:var(--verm);color:#fff;border-radius:6px;}
  .chk-done{width:22px;height:22px;border-radius:50%;background:var(--jade);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;flex:none;}
  .chk-next{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--verm);display:flex;align-items:center;justify-content:center;flex:none;}
  .chk-todo{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line2);flex:none;}
  .vtag{font-family:'Noto Serif TC',serif;writing-mode:vertical-rl;font-size:11px;padding:5px 3px;letter-spacing:.12em;border-radius:3px;flex:none;}
  @keyframes shimmer{0%{background-position:-120px 0;}100%{background-position:120px 0;}}
  .skel{background:linear-gradient(90deg,var(--line) 25%,var(--line2) 50%,var(--line) 75%);background-size:240px 100%;animation:shimmer 1.4s ease-in-out infinite;flex:none;}
</style>
</head>
